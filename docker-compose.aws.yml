services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REPORTS_OUTPUT_DIR: ${REPORTS_OUTPUT_DIR:-/app/artifacts}
      NODE_ENV: production
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REPORTS_OUTPUT_DIR: ${REPORTS_OUTPUT_DIR:-/app/artifacts}
      NODE_ENV: production

