name: AWS App Deploy

on:
  workflow_dispatch:
    

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/multi-tenant-saas-reports
            git fetch origin main
            git reset --hard origin/main
            cat > .env <<'EOF'
            NODE_ENV=production
            DATABASE_URL=${{ secrets.APP_DATABASE_URL }}
            REDIS_URL=${{ secrets.APP_REDIS_URL }}
            AUTH_SESSION_SECRET=${{ secrets.APP_AUTH_SESSION_SECRET }}
            REPORTS_OUTPUT_DIR=/app/artifacts
            SMTP_URL=${{ secrets.APP_SMTP_URL }}
            SMTP_FROM=${{ secrets.APP_SMTP_FROM }}
            EOF
            docker compose -f docker-compose.aws.yml run --rm web npm run migrate:deploy --workspace @saas/db
            docker compose -f docker-compose.aws.yml up -d --build
