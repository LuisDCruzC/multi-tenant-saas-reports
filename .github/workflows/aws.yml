name: AWS Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        type: choice
        options:
          - deploy
          - start
          - stop
        default: deploy

jobs:
  lifecycle:
    if: ${{ inputs.action == 'start' || inputs.action == 'stop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start EC2 instance
        if: ${{ inputs.action == 'start' }}
        run: aws ec2 start-instances --instance-ids "${{ secrets.AWS_INSTANCE_ID }}"

      - name: Stop EC2 instance
        if: ${{ inputs.action == 'stop' }}
        run: aws ec2 stop-instances --instance-ids "${{ secrets.AWS_INSTANCE_ID }}"

  deploy:
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/multi-tenant-saas-reports
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.aws.yml up -d --build
